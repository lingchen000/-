<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">相同键集合在不同二叉搜索树形状中的查找成本</title>
  <desc id="desc">左边是顺序插入形成的退化链，右边是较平衡的搜索树；查找七在左边要经过七个节点，在右边只经过三个节点。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#dbe3ee;stroke-width:2}.h1{font:700 30px 'Microsoft YaHei',sans-serif;fill:#102a43}.h2{font:700 22px 'Microsoft YaHei',sans-serif;fill:#173f5f}.body{font:17px 'Microsoft YaHei',sans-serif;fill:#334e68}.small{font:15px 'Microsoft YaHei',sans-serif;fill:#486581}.edge{stroke:#829ab1;stroke-width:3}.hot{stroke:#e76f51;stroke-width:6}.node{fill:#e8f3ff;stroke:#247ba0;stroke-width:2}.hit{fill:#ffe8df;stroke:#e76f51;stroke-width:3}.num{font:700 19px ui-monospace,Consolas,monospace;fill:#102a43;text-anchor:middle;dominant-baseline:middle}.badge{fill:#fff1cc;stroke:#c68a00;stroke-width:1.5}.badgeText{font:700 17px 'Microsoft YaHei',sans-serif;fill:#7a5200}.rule{fill:#effaf6;stroke:#b8e6d6;stroke-width:1.5}.ruleText{font:16px 'Microsoft YaHei',sans-serif;fill:#1d6f58}
    </style>
  </defs>
  <rect class="bg" width="1200" height="650"/>
  <text class="h1" x="60" y="55">同一组键，树的形状会改变查找成本</text>
  <rect class="panel" x="50" y="85" rx="18" width="525" height="490"/>
  <rect class="panel" x="625" y="85" rx="18" width="525" height="490"/>
  <text class="h2" x="80" y="125">顺序插入 1, 2, 3, 4, 5, 6, 7</text>
  <text class="body" x="80" y="155">普通 BST 退化成链；查找 7 要走 7 层。</text>
  <g>
    <line class="hot" x1="155" y1="205" x2="215" y2="255"/><line class="hot" x1="215" y1="255" x2="275" y2="305"/><line class="hot" x1="275" y1="305" x2="335" y2="355"/><line class="hot" x1="335" y1="355" x2="395" y2="405"/><line class="hot" x1="395" y1="405" x2="455" y2="455"/><line class="hot" x1="455" y1="455" x2="515" y2="505"/>
    <circle class="node" cx="155" cy="205" r="25"/><text class="num" x="155" y="205">1</text>
    <circle class="node" cx="215" cy="255" r="25"/><text class="num" x="215" y="255">2</text>
    <circle class="node" cx="275" cy="305" r="25"/><text class="num" x="275" y="305">3</text>
    <circle class="node" cx="335" cy="355" r="25"/><text class="num" x="335" y="355">4</text>
    <circle class="node" cx="395" cy="405" r="25"/><text class="num" x="395" y="405">5</text>
    <circle class="node" cx="455" cy="455" r="25"/><text class="num" x="455" y="455">6</text>
    <circle class="hit" cx="515" cy="505" r="25"/><text class="num" x="515" y="505">7</text>
  </g>
  <rect class="badge" x="90" y="486" rx="12" width="250" height="50"/><text class="badgeText" x="110" y="518">7 层，查找 Θ(N)</text>

  <text class="h2" x="655" y="125">维护较平衡的形状</text>
  <text class="body" x="655" y="155">路径变短；查找 7 只经过 4 → 6 → 7。</text>
  <g>
    <line class="edge" x1="885" y1="215" x2="765" y2="305"/><line class="hot" x1="885" y1="215" x2="1005" y2="305"/>
    <line class="edge" x1="765" y1="305" x2="700" y2="405"/><line class="edge" x1="765" y1="305" x2="830" y2="405"/>
    <line class="edge" x1="1005" y1="305" x2="940" y2="405"/><line class="hot" x1="1005" y1="305" x2="1070" y2="405"/>
    <circle class="node" cx="885" cy="215" r="29"/><text class="num" x="885" y="215">4</text>
    <circle class="node" cx="765" cy="305" r="29"/><text class="num" x="765" y="305">2</text>
    <circle class="node" cx="1005" cy="305" r="29"/><text class="num" x="1005" y="305">6</text>
    <circle class="node" cx="700" cy="405" r="29"/><text class="num" x="700" y="405">1</text>
    <circle class="node" cx="830" cy="405" r="29"/><text class="num" x="830" y="405">3</text>
    <circle class="node" cx="940" cy="405" r="29"/><text class="num" x="940" y="405">5</text>
    <circle class="hit" cx="1070" cy="405" r="29"/><text class="num" x="1070" y="405">7</text>
  </g>
  <rect class="badge" x="770" y="486" rx="12" width="275" height="50"/><text class="badgeText" x="790" y="518">3 层，查找 Θ(log N)</text>
  <rect class="rule" x="365" y="590" rx="12" width="470" height="40"/><text class="ruleText" x="390" y="616">平衡结构的价值：付出维护不变量的成本，换取可预测的高度。</text>
</svg>
