<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">缓存块与时间、空间局部性</title>
  <desc id="desc">左侧展示连续数组按缓存块搬运，比较顺序访问与跨步访问；右侧展示多级存储层次和平均访问时间公式。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#dbe3ee;stroke-width:2}.h1{font:700 30px 'Microsoft YaHei',sans-serif;fill:#102a43}.h2{font:700 21px 'Microsoft YaHei',sans-serif;fill:#173f5f}.body{font:17px 'Microsoft YaHei',sans-serif;fill:#334e68}.small{font:15px 'Microsoft YaHei',sans-serif;fill:#486581}.mono{font:700 16px ui-monospace,Consolas,monospace;fill:#102a43}.cell{stroke:#247ba0;stroke-width:1.7}.b0{fill:#dff0ff}.b1{fill:#e7f8ef}.b2{fill:#fff3d6}.b3{fill:#f0eaff}.hit{fill:#d9f7ef;stroke:#1d8a6d;stroke-width:2}.miss{fill:#fff0f0;stroke:#d64545;stroke-width:2}.arrow{fill:none;stroke:#526d82;stroke-width:2.5;marker-end:url(#arrow)}.fast{fill:#e8f3ff;stroke:#247ba0;stroke-width:2}.mid{fill:#e7f8ef;stroke:#208761;stroke-width:2}.slow{fill:#fff3d6;stroke:#c68a00;stroke-width:2}.storage{fill:#ffe9ef;stroke:#c0446d;stroke-width:2}.label{font:700 16px 'Microsoft YaHei',sans-serif}.green{fill:#157153}.red{fill:#b62e2e}.amber{fill:#9a6900}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#526d82"/></marker>
  </defs>
  <rect class="bg" width="1200" height="680"/>
  <text class="h1" x="55" y="55">缓存不只保存“一个值”，而是押注你接下来还会访问附近的数据</text>
  <rect class="panel" x="45" y="85" width="690" height="530" rx="18"/>
  <text class="h2" x="75" y="127">A. 一个未命中会带回整个缓存块</text>
  <text class="body" x="75" y="157">例：每块包含 4 个整数。访问 a[0] 时，a[0..3] 一起进入缓存。</text>
  <g transform="translate(80,205)">
    <text class="small" x="0" y="-15">内存中的连续数组</text>
    <rect class="cell b0" x="0" y="0" width="70" height="56"/><rect class="cell b0" x="70" y="0" width="70" height="56"/><rect class="cell b0" x="140" y="0" width="70" height="56"/><rect class="cell b0" x="210" y="0" width="70" height="56"/>
    <rect class="cell b1" x="280" y="0" width="70" height="56"/><rect class="cell b1" x="350" y="0" width="70" height="56"/><rect class="cell b1" x="420" y="0" width="70" height="56"/><rect class="cell b1" x="490" y="0" width="70" height="56"/>
    <rect class="cell b2" x="560" y="0" width="70" height="56"/>
    <text class="mono" x="22" y="35">a0</text><text class="mono" x="92" y="35">a1</text><text class="mono" x="162" y="35">a2</text><text class="mono" x="232" y="35">a3</text><text class="mono" x="302" y="35">a4</text><text class="mono" x="372" y="35">a5</text><text class="mono" x="442" y="35">a6</text><text class="mono" x="512" y="35">a7</text><text class="mono" x="582" y="35">a8</text>
    <path class="arrow" d="M140 75 L140 120"/><text class="label green" x="0" y="145">顺序访问 a0→a1→a2→a3：1 次 miss + 3 次 hit</text>
    <path class="arrow" d="M570 170 L570 215"/><text class="label red" x="0" y="240">跨步访问 a0→a4→a8：不断换块，空间局部性很差</text>
  </g>
  <rect class="hit" x="80" y="495" width="295" height="78" rx="12"/>
  <text class="label green" x="103" y="526">时间局部性</text><text class="small" x="103" y="553">刚访问的数据很快再次被访问</text>
  <rect class="hit" x="400" y="495" width="295" height="78" rx="12"/>
  <text class="label green" x="423" y="526">空间局部性</text><text class="small" x="423" y="553">访问地址附近的数据很快被访问</text>

  <rect class="panel" x="770" y="85" width="385" height="530" rx="18"/>
  <text class="h2" x="800" y="127">B. 存储层次隐藏延迟</text>
  <rect class="fast" x="855" y="170" width="210" height="58" rx="12"/><text class="label" x="918" y="205" fill="#173f5f">寄存器</text>
  <rect class="mid" x="835" y="250" width="250" height="62" rx="12"/><text class="label" x="910" y="287" fill="#157153">L1 / L2 / L3 缓存</text>
  <rect class="slow" x="815" y="334" width="290" height="66" rx="12"/><text class="label amber" x="922" y="373">主存</text>
  <rect class="storage" x="795" y="424" width="330" height="70" rx="12"/><text class="label" x="900" y="465" fill="#a83258">持久存储</text>
  <text class="small" x="815" y="523">越往上：更快、更小、更贵</text>
  <text class="small" x="815" y="550">越往下：更慢、更大、更便宜</text>
  <rect x="795" y="568" width="330" height="29" rx="8" fill="#effaf6" stroke="#b8e6d6"/>
  <text class="mono" x="812" y="589">AMAT = hit time + miss rate × penalty</text>
  <text class="small" x="58" y="651">图 4　性能取决于访问模式与整个存储层次；“算法一样”并不保证真实运行时间一样。</text>
</svg>
