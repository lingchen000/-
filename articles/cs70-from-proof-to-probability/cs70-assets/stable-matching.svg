<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs><style>
    .title{font:700 34px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#102a43}.sub{font:400 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52677c}.h{font:700 24px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#102a43}.t{font:400 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#334e68}.small{font:400 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#627d98}.node{fill:#fff;stroke:#7aa7f7;stroke-width:3}.pair{stroke:#276ef1;stroke-width:5}.block{stroke:#e11d48;stroke-width:5;stroke-dasharray:12 10;fill:none}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}
  </style></defs>
  <rect width="1200" height="720" rx="28" fill="#f4f8fc"/>
  <text x="60" y="62" class="title">稳定匹配：没有“双方都想私下换人”的阻塞对</text>
  <text x="60" y="94" class="sub">稳定性是局部偏好约束，不等于平均满意度最高，也不等于结果对双方公平。</text>

  <rect x="60" y="130" width="510" height="395" rx="20" class="card"/>
  <text x="92" y="173" class="h">不稳定的匹配</text>
  <text x="92" y="205" class="small">A–X，B–Y 已配对，但 B 和 X 互相更偏好对方</text>
  <text x="105" y="260" class="t">提出方</text><text x="430" y="260" class="t">接收方</text>
  <circle cx="145" cy="325" r="38" class="node"/><text x="133" y="333" class="h">A</text>
  <circle cx="145" cy="435" r="38" class="node"/><text x="133" y="443" class="h">B</text>
  <circle cx="485" cy="325" r="38" class="node"/><text x="473" y="333" class="h">X</text>
  <circle cx="485" cy="435" r="38" class="node"/><text x="473" y="443" class="h">Y</text>
  <line x1="184" y1="325" x2="446" y2="325" class="pair"/>
  <line x1="184" y1="435" x2="446" y2="435" class="pair"/>
  <path d="M181 415 Q315 320 450 342" class="block"/>
  <text x="222" y="385" class="small" fill="#e11d48">阻塞对 B–X</text>

  <rect x="630" y="130" width="510" height="395" rx="20" class="card"/>
  <text x="662" y="173" class="h">稳定的匹配</text>
  <text x="662" y="205" class="small">改为 A–Y，B–X；不存在双方都愿意离开当前对象的组合</text>
  <text x="675" y="260" class="t">提出方</text><text x="1000" y="260" class="t">接收方</text>
  <circle cx="715" cy="325" r="38" class="node"/><text x="703" y="333" class="h">A</text>
  <circle cx="715" cy="435" r="38" class="node"/><text x="703" y="443" class="h">B</text>
  <circle cx="1055" cy="325" r="38" class="node"/><text x="1043" y="333" class="h">X</text>
  <circle cx="1055" cy="435" r="38" class="node"/><text x="1043" y="443" class="h">Y</text>
  <line x1="751" y1="342" x2="1019" y2="418" class="pair"/>
  <line x1="751" y1="418" x2="1019" y2="342" class="pair"/>
  <circle cx="885" cy="380" r="28" fill="#dcfce7" stroke="#39a75a" stroke-width="2"/><text x="873" y="389" class="h" fill="#287a40">✓</text>

  <rect x="60" y="565" width="1080" height="110" rx="18" fill="#e8f1ff"/>
  <text x="92" y="607" class="h">提出—拒绝算法保证什么？</text>
  <text x="92" y="642" class="t">有限轮后终止并得到稳定匹配；对提出方整体最优、对接收方整体最差（在所有稳定匹配中）。</text>
  <text x="92" y="668" class="small">这项不对称性提醒我们：算法正确性、稳定性与公平性是三个不同问题。</text>
</svg>
